
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliographie RMPR et RNS</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 1050px;
  margin: 40px auto;
  padding: 0 20px;
  color: #333;
  line-height: 1.6;
}
h1 { color: #34534a; }
.intro { color: #666; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 25px 0;
}
input, select {
  padding: 10px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 5px;
}
input { flex: 1; min-width: 200px; }
#status { margin: 20px 0; color: #666; }
.year {
  font-size: 1.3em;
  font-weight: bold;
  color: #34534a;
  border-bottom: 1px solid #ddd;
  margin-top: 30px;
}
.reference {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
.reference a { color: #246b86; }
.tags { font-size: 12px; color: #777; }
footer {
  margin: 40px 0;
  font-size: 13px;
  color: #777;
}
</style>
</head>
<body>

<h1>Bibliographie des RMPR et RNS</h1>

<p class="intro">
Bibliographie issue du groupe Zotero BDA Biblio.
Les références sont mises à jour automatiquement.
</p>

<div class="controls">
  <input id="search" type="search"
         placeholder="Rechercher un auteur, un titre, une année...">
  <select id="tag">
    <option value="ALL">RMPR + RNS</option>
    <option value="RMPR">RMPR uniquement</option>
    <option value="RNS">RNS uniquement</option>
  </select>
</div>

<div id="status">Chargement des références Zotero...</div>
<div id="results"></div>

<footer>
Source :
<a href="https://www.zotero.org/groups/154609/bda_biblio"
   target="_blank" rel="noopener">
Groupe Zotero BDA Biblio
</a>
</footer>

<script>
const GROUP = 154609;
const TAGS = ["RMPR", "RNS"];
const API = `https://api.zotero.org/groups/${GROUP}/items/top`;
let references = [];

async function fetchTag(tag) {
  let all = [];
  let start = 0;
  const limit = 100;

  while (true) {
    const url = new URL(API);
    url.searchParams.set("tag", tag);
    url.searchParams.set("format", "json");
    url.searchParams.set("limit", limit);
    url.searchParams.set("start", start);

    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(
        `Erreur Zotero ${response.status} pour ${tag}`
      );
    }

    const batch = await response.json();
    all.push(...batch);

    document.getElementById("status").textContent =
      `${tag} : ${all.length} références récupérées...`;

    if (batch.length < limit) break;
    start += limit;
  }
  return all;
}

function getYear(date) {
  const match = String(date || "").match(
    /\b(1[5-9]\d{2}|20\d{2}|21\d{2})\b/
  );
  return match ? match[0] : "Sans date";
}

function authors(data) {
  const people = (data.creators || [])
    .filter(c => ["author", "editor"].includes(c.creatorType))
    .map(c => c.name ||
      [c.lastName, c.firstName].filter(Boolean).join(", "));
  return people.join("; ") || "Auteur non renseigné";
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol)
      ? url.href : null;
  } catch {
    return null;
  }
}

function render() {
  const search = document.getElementById("search")
    .value.toLocaleLowerCase("fr").trim();
  const tag = document.getElementById("tag").value;
  const container = document.getElementById("results");
  container.replaceChildren();

  const filtered = references.filter(item => {
    const d = item.data;
    const itemTags = (d.tags || []).map(t => t.tag);
    const matchesTag =
      tag === "ALL" || itemTags.includes(tag);
    const searchable = [
      authors(d), d.title, d.date,
      d.publicationTitle, d.bookTitle,
      d.publisher, d.DOI
    ].join(" ").toLocaleLowerCase("fr");
    return matchesTag && searchable.includes(search);
  });

  filtered.sort((a, b) => {
    const ya = parseInt(getYear(a.data.date)) || 0;
    const yb = parseInt(getYear(b.data.date)) || 0;
    return yb - ya ||
      (a.data.title || "").localeCompare(b.data.title || "");
  });

  document.getElementById("status").textContent =
    `${filtered.length} références affichées sur ` +
    `${references.length} références distinctes.`;

  let currentYear = "";

  for (const item of filtered) {
    const d = item.data;
    const year = getYear(d.date);

    if (year !== currentYear) {
      const heading = document.createElement("h2");
      heading.className = "year";
      heading.textContent = year;
      container.appendChild(heading);
      currentYear = year;
    }

    const div = document.createElement("div");
    div.className = "reference";

    const text = document.createElement("span");
    const source = [
      d.publicationTitle || d.bookTitle,
      d.volume ? `vol. ${d.volume}` : "",
      d.issue ? `n° ${d.issue}` : "",
      d.pages ? `p. ${d.pages}` : "",
      d.publisher || ""
    ].filter(Boolean).join(", ");

    text.textContent =
      `${authors(d)} (${year}). ${d.title || "Sans titre"}. ` +
      (source ? `${source}. ` : "");
    div.appendChild(text);

    const doi = d.DOI
      ? safeUrl("https://doi.org/" +
          d.DOI.replace(/^https?:\/\/doi\.org\//i, ""))
      : null;

    const zotero = safeUrl(item.links?.alternate?.href);
    const target = doi || zotero;

    if (target) {
      const link = document.createElement("a");
      link.href = target;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = doi ? "DOI" : "Zotero";
      div.appendChild(link);
    }

    const tagNames = (d.tags || [])
      .map(t => t.tag).filter(t => TAGS.includes(t));
    const tagLine = document.createElement("div");
    tagLine.className = "tags";
    tagLine.textContent = tagNames.join(" · ");
    div.appendChild(tagLine);

    container.appendChild(div);
  }
}

async function load() {
  try {
    const combined = new Map();

    for (const tag of TAGS) {
      const items = await fetchTag(tag);
      for (const item of items) {
        combined.set(item.key, item);
      }
    }

    references = Array.from(combined.values());
    render();
  } catch (error) {
    document.getElementById("status").textContent =
      "Impossible de charger la bibliographie : " +
      error.message;
  }
}

document.getElementById("search")
  .addEventListener("input", render);
document.getElementById("tag")
  .addEventListener("change", render);

load();
</script>
</body>
</html>
