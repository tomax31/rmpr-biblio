<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliographie RMPR et RNS</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 1050px;
  margin: 40px auto;
  padding: 0 20px;
  color: #333;
  line-height: 1.6;
}
h1, h2 { color: #34534a; }
.intro { color: #666; }

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 25px 0;
}
.stat {
  background: #f0f5f2;
  padding: 12px 20px;
  border-radius: 8px;
}
.stat strong {
  font-size: 1.4em;
  color: #34534a;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 25px 0;
}
input, select {
  padding: 10px;
  font-size: 15px;
  border: 1px solid #ccc;
  border-radius: 5px;
}
input { flex: 1; min-width: 200px; }
#status { margin: 20px 0; color: #666; }
.year {
  border-bottom: 1px solid #ddd;
  margin-top: 30px;
}
.reference {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
  overflow-wrap: anywhere;
}
.reference a { color: #246b86; }
.links { font-size: 0.85em; margin-top: 5px; }
.links a { margin-right: 15px; }
footer { margin: 40px 0; color: #777; font-size: 13px; }
</style>
</head>

<body>

<h1>Bibliographie des RMPR et RNS</h1>

<p class="intro">
Références issues du groupe Zotero
<a href="https://www.zotero.org/groups/154609/bda_biblio">
BDA Biblio</a>.
Bibliographie mise à jour automatiquement.
</p>

<div class="stats">
  <div class="stat">
    Total distinct : <strong id="countAll">—</strong>
  </div>
  <div class="stat">
    RMPR : <strong id="countRMPR">—</strong>
  </div>
  <div class="stat">
    RNS : <strong id="countRNS">—</strong>
  </div>
</div>

<div class="controls">
  <input id="search" type="search"
    placeholder="Rechercher un auteur, un titre, une année...">

  <select id="tag">
    <option value="ALL">RMPR + RNS</option>
    <option value="RMPR">RMPR uniquement</option>
    <option value="RNS">RNS uniquement</option>
  </select>
</div>

<div id="status">Chargement des références Zotero...</div>
<main id="results"></main>

<footer>
Bibliographie ISO 690 (auteur-date), générée par Zotero.
</footer>

<script>
"use strict";

const GROUP = 154609;
const TAGS = ["RMPR", "RNS"];
const API = `https://api.zotero.org/groups/${GROUP}/items/top`;
const STYLE = "iso690-author-date-fr";

let references = [];

const el = id => document.getElementById(id);

function getYear(date) {
  const match = String(date || "").match(
    /\b(1[5-9]\d{2}|20\d{2}|21\d{2})\b/
  );
  return match ? match[0] : "Sans date";
}

function getAuthors(data) {
  return (data.creators || [])
    .filter(c => ["author", "editor"].includes(c.creatorType))
    .map(c => c.name ||
      [c.lastName, c.firstName].filter(Boolean).join(", "))
    .join("; ") || "Auteur non renseigné";
}

function getTags(item) {
  return (item.data.tags || []).map(t => t.tag);
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol)
      ? url.href : null;
  } catch {
    return null;
  }
}

function fallback(data) {
  const source = [
    data.publicationTitle || data.bookTitle,
    data.volume ? "vol. " + data.volume : "",
    data.issue ? "n° " + data.issue : "",
    data.pages ? "p. " + data.pages : "",
    data.publisher || ""
  ].filter(Boolean).join(", ");

  return `${getAuthors(data)} (${getYear(data.date)}). ` +
    `${data.title || "Sans titre"}. ${source}`;
}

function bibliography(item) {
  const div = document.createElement("div");

  if (typeof item.bib === "string" && item.bib.trim()) {
    const doc = new DOMParser().parseFromString(
      item.bib, "text/html"
    );

    // Nettoyage du HTML fourni par Zotero
    doc.querySelectorAll(
      "script,style,iframe,object,embed,form,svg,math,link,meta"
    ).forEach(node => node.remove());

    doc.querySelectorAll("*").forEach(node => {
      for (const attr of [...node.attributes]) {
        const name = attr.name.toLowerCase();
        if (
          name.startsWith("on") ||
          name === "style" ||
          name === "srcdoc" ||
          (name === "href" && !safeUrl(attr.value))
        ) {
          node.removeAttribute(attr.name);
        }
      }
      if (node.tagName === "A") {
        node.target = "_blank";
        node.rel = "noopener noreferrer";
      }
    });

    while (doc.body.firstChild) {
      div.appendChild(doc.body.firstChild);
    }
  } else {
    div.textContent = fallback(item.data);
  }

  return div;
}

function updateCounters() {
  el("countAll").textContent = references.length;

  el("countRMPR").textContent = references.filter(
    item => getTags(item).includes("RMPR")
  ).length;

  el("countRNS").textContent = references.filter(
    item => getTags(item).includes("RNS")
  ).length;
}

function render() {
  const search = el("search").value
    .toLocaleLowerCase("fr").trim();
  const tag = el("tag").value;

  const filtered = references.filter(item => {
    const d = item.data;

    if (tag !== "ALL" && !getTags(item).includes(tag)) {
      return false;
    }

    const text = [
      getAuthors(d), d.title, d.date,
      d.publicationTitle, d.bookTitle,
      d.publisher, d.DOI
    ].join(" ").toLocaleLowerCase("fr");

    return text.includes(search);
  });

  filtered.sort((a, b) => {
    const ya = parseInt(getYear(a.data.date)) || 0;
    const yb = parseInt(getYear(b.data.date)) || 0;
    return yb - ya ||
      (a.data.title || "").localeCompare(
        b.data.title || "", "fr"
      );
  });

  const fragment = document.createDocumentFragment();
  let currentYear = "";

  for (const item of filtered) {
    const year = getYear(item.data.date);

    if (year !== currentYear) {
      const heading = document.createElement("h2");
      heading.className = "year";
      heading.textContent = year;
      fragment.appendChild(heading);
      currentYear = year;
    }

    const article = document.createElement("article");
    article.className = "reference";
    article.appendChild(bibliography(item));

    const links = document.createElement("div");
    links.className = "links";

    const doi = item.data.DOI
      ? safeUrl("https://doi.org/" +
          item.data.DOI.replace(
            /^https?:\/\/doi\.org\//i, ""
          ))
      : null;

    const zotero = safeUrl(
      item.links?.alternate?.href
    );

    for (const [url, label] of [
      [doi, "DOI"],
      [zotero, "Notice Zotero"]
    ]) {
      if (url) {
        const a = document.createElement("a");
        a.href = url;
        a.textContent = label;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        links.appendChild(a);
      }
    }

    article.appendChild(links);
    fragment.appendChild(article);
  }

  el("results").replaceChildren(fragment);

  el("status").textContent =
    `${filtered.length} références affichées sur ` +
    `${references.length} références distinctes.`;
}

async function load() {
  try {
    const byKey = new Map();

    for (const tag of TAGS) {
      let start = 0;

      while (true) {
        const url = new URL(API);

        url.searchParams.set("tag", tag);
        url.searchParams.set("format", "json");
        url.searchParams.set("include", "data,bib");
        url.searchParams.set("style", STYLE);
        url.searchParams.set("limit", "100");
        url.searchParams.set("start", String(start));

        const response = await fetch(url, {
          headers: { "Zotero-API-Version": "3" }
        });

        if (!response.ok) {
          throw new Error(
            `Erreur Zotero HTTP ${response.status}`
          );
        }

        const batch = await response.json();

        if (!Array.isArray(batch)) {
          throw new Error("Réponse Zotero inattendue");
        }

        for (const item of batch) {
          byKey.set(item.key, item);
        }

        el("status").textContent =
          `Chargement ${tag} : ` +
          `${start + batch.length} références...`;

        if (batch.length < 100) break;
        start += 100;
      }
    }

    references = [...byKey.values()];

    updateCounters();
    render();

  } catch (error) {
    el("status").textContent =
      "Impossible de charger la bibliographie : " +
      error.message;
    console.error(error);
  }
}

el("search").addEventListener("input", render);
el("tag").addEventListener("change", render);

load();
</script>

</body>
</html>
